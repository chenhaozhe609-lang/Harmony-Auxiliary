# pnpm blocks dependency build/lifecycle scripts by default for security. The
# esbuild needs its install script to set up the platform binary.
allowBuilds:
  esbuild: true
# Standard-pnpm equivalent, so a plain `pnpm install` (without the runtime
# wrapper) also approves the same package.
onlyBuiltDependencies:
  - esbuild

packages:
  - apps/web
